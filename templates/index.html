<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            text-align: left;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #memeContainer {
            margin-top: 20px;
        }

        #generatedMeme {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
        }

    </style>
</head>
<body>

    <div class="card">
        <h1>Meme generator</h1>
        <form id="memeForm" enctype="multipart/form-data">
            <label for="image">Izberi sliko:</label>
            <input type="file" id="image" name="image" accept="image/*" required><br><br>

            <label for="top_text">Zgornji tekst:</label>
            <input type="text" id="top_text" name="top_text" required><br><br>

            <label for="bottom_text">Spodnji tekst:</label>
            <input type="text" id="bottom_text" name="bottom_text" required><br><br>

            <button type="submit">Generiraj meme</button>
        </form>


        <div id="memeContainer" style="display: none;">
            <h2>Generiran meme:</h2>
            <img id="generatedMeme" src="" alt="Generated Meme">
        </div>
    </div>

    <script>
        document.getElementById("memeForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const formData = new FormData();
            formData.append("image", document.getElementById("image").files[0]);
            formData.append("top_text", document.getElementById("top_text").value);
            formData.append("bottom_text", document.getElementById("bottom_text").value);

            fetch('/generateMeme', {
                method: 'POST',
                body: formData
            })
            .then(response => response.blob())
            .then(imageBlob => {
                const imageUrl = URL.createObjectURL(imageBlob);

                const memeImage = document.getElementById("generatedMeme");
                const memeContainer = document.getElementById("memeContainer")
                memeImage.src = imageUrl;
                memeContainer.style.display = "block";
            })
            .catch(error => {
                console.error("Prislo je do napake pri generiranju slike:", error);
                alert("Prislo je do napake pri generiranju slike.");
            });
        });
    </script>
</body>
</html>
